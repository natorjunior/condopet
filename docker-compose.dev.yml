version: '3.8'

services:
  condopet-api:
    build: .
    container_name: condopet-api-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=chave_secreta_desenvolvimento
      - DATABASE_URL=/app/data/database.sqlite
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./package.json:/app/package.json
    command: npm run dev
    restart: unless-stopped

volumes:
  data:
  uploads:
