version: '3.8'

services:
  condopet-api:
    build: .
    container_name: condopet-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=sua_chave_secreta_jwt_muito_segura_em_producao
      - DATABASE_URL=/app/data/database.sqlite
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nginx como proxy reverso (opcional)
  nginx:
    image: nginx:alpine
    container_name: condopet-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - condopet-api
    restart: unless-stopped

volumes:
  data:
  uploads:
